# Publishes the website on GitHub Pages: https://antidote1911.github.io/Hydra64/
#
#   push to master that changes the site   publishes it again
#   "Run workflow" button (Actions tab)     the same, by hand
#
# The site is assembled by tools/website/build.sh from files of the repository: the home page
# (website/), the user manual (Manual.html, served under /manual/), the screenshots and the logo.
# Nothing else of the repository is published.
# Pages must be set to "GitHub Actions" (Settings → Pages → Source).
name: Website

on:
  push:
    branches: [master]
    paths: ['website/**', 'Manual.html', 'docs/screenshots/**', 'resources/hydra64.svg', 'tools/website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # a publication under way is finished, the next one follows

jobs:
  publish:
    name: Publish the site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: tools/website/build.sh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
