# Builds Hydra64 for Windows and Linux and publishes both in a GitHub release.
#
#   git tag v1.0.0 && git push origin v1.0.0    builds, then creates the release "v1.0.0" with
#                                               the Windows installer and archive, the Linux
#                                               AppImage, their checksums (SHA256SUMS) and the
#                                               notes of .github/release-notes.md
#   "Run workflow" button (Actions tab)         builds only: the files are kept as
#                                               artifacts of the run, no release is created
#   the same with "release" filled in (v1.0.0)  builds the branch, names the files after that
#                                               release and adds to it those it does not have
#                                               yet — a file already published is never replaced
#
# Windows: built on a Windows machine with MSYS2 (UCRT64: its MinGW, its Qt, its Rust), packed by
# the same script as "./build.sh --win", which stays the way to build for Windows from Linux.
# The installer (NSIS, tools/windows/installer.nsi) holds the same folder as the archive.
# Linux: built on Ubuntu 24.04 with the official Qt, packed as an AppImage (glibc 2.39 or later);
# the same folder also makes the .tar.gz archive and the Debian package (program in /opt/hydra64).
# Flatpak: built from packaging/flatpak/, on the KDE runtime.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Existing release to add the missing files to (v1.0.0); empty: build only'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.12.0' # Linux build; the Windows build takes the version MSYS2 offers
  LABEL: ${{ inputs.release || github.ref_name }} # in the names of the files: the tag, or the branch

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep the line endings of the repository
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Install the tools (MSYS2, UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-nsis

      - name: Build
        # x86-64-avx2: Stockfish must not be tuned for the processor of the build machine
        run: |
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DHYDRA64_TESTS=OFF \
              -DSTOCKFISH_ARCH=x86-64-avx2
          cmake --build build-win --parallel "$(nproc)"

      - name: Pack the archive
        # Same script as "./build.sh --win"; the DLLs are those of the MSYS2 just installed.
        run: |
          python tools/windows/package.py build-win "$(cygpath -m "$MINGW_PREFIX")" \
              "Hydra64-${LABEL//\//-}-windows-x64.zip"

      - name: Build the installer
        # The folder package.py has just gathered (build-win/Hydra64), as it is. Version: that of
        # the tag, otherwise that of CMakeLists.txt. Windows paths, passed without MSYS2 rewriting.
        env:
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          version=${LABEL#v}
          [[ $LABEL == v* ]] || version=$(sed -n 's/^project(Hydra64 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          printf '\xEF\xBB\xBF' > build-win/LICENSE.txt && cat LICENSE >> build-win/LICENSE.txt # UTF-8 mark: see the script
          makensis -V2 -DVERSION="$version" -DROOT="$(cygpath -w "$PWD")" \
              -DLICENSE="$(cygpath -w "$PWD/build-win/LICENSE.txt")" \
              -DSTAGE="$(cygpath -w "$PWD/build-win/Hydra64")" \
              -DOUTFILE="$(cygpath -w "$PWD")\\Hydra64-${LABEL//\//-}-windows-x64-setup.exe" \
              tools/windows/installer.nsi

      - name: Check that the programs start
        # Outside MSYS2: only the DLLs of the archive are within reach, as on a user's machine.
        shell: pwsh
        timeout-minutes: 5
        env:
          QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES: 1 # --version: text, not a dialog to close
        run: |
          Expand-Archive -Path (Get-Item Hydra64-*-windows-x64.zip).FullName -DestinationPath check
          $p = Start-Process -FilePath check\Hydra64\hydra64.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "hydra64.exe --version: exit code $($p.ExitCode)" }
          'quit' | & check\Hydra64\stockfish.exe
          if ($LASTEXITCODE -ne 0) { throw "stockfish.exe: exit code $LASTEXITCODE" }

      - name: Check the installer
        # Silent installation into a folder with a space, program started from there, then
        # silent removal ("_?=": the uninstaller runs in place and is waited for).
        shell: pwsh
        timeout-minutes: 10
        env:
          QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES: 1
        run: |
          $setup = (Get-Item Hydra64-*-windows-x64-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'Hydra64 test'
          $p = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer: exit code $($p.ExitCode)" }
          foreach ($f in 'hydra64.exe', 'stockfish.exe', 'shuffle.exe', 'uninstall.exe', 'databases\games\Masters_1000.hy64', 'plugins\platforms\qwindows.dll') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "installer: $f is missing" }
          }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Hydra64.lnk")) { throw 'installer: no Start menu entry' }
          $open = (Get-ItemProperty 'HKLM:\Software\Classes\Hydra64.Database\shell\open\command').'(default)'
          if ($open -ne "`"$dir\hydra64.exe`" `"%1`"") { throw "installer: .hy64 files open with: $open" }
          if ((Get-ItemProperty 'HKLM:\Software\Classes\.hy64').'(default)' -ne 'Hydra64.Database') { throw 'installer: .hy64 is not associated' }
          $p = Start-Process -FilePath (Join-Path $dir 'hydra64.exe') -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installed hydra64.exe --version: exit code $($p.ExitCode)" }
          $p = Start-Process -FilePath (Join-Path $dir 'uninstall.exe') -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller: exit code $($p.ExitCode)" }
          if (Test-Path (Join-Path $dir 'hydra64.exe')) { throw 'uninstaller: hydra64.exe is still there' }
          if (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Hydra64.lnk") { throw 'uninstaller: the Start menu entry is still there' }
          if ((Test-Path 'HKLM:\Software\Classes\Hydra64.Database') -or (Test-Path 'HKLM:\Software\Classes\.hy64')) { throw 'uninstaller: the file types are still registered' }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Hydra64-*-windows-x64.zip
            Hydra64-*-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0 # already compressed

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v7

      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              g++-14 ninja-build zlib1g-dev libfuse3-dev libgl1-mesa-dev libxkbcommon-dev libcups2 \
              libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
              libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
              libfontconfig1 libdbus-1-3 libegl1 libwayland-client0 libwayland-cursor0 libwayland-egl1
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Build
        # x86-64-avx2: Stockfish must not be tuned for the processor of the build machine
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTOCKFISH_ARCH=x86-64-avx2
          cmake --build build --parallel "$(nproc)" --target hydra64 hydra64-convert hydra64-tablefs

      - name: Pack the AppImage
        # Engines and bundled databases go next to the program, where it looks for them.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # no FUSE on the build machine
          NO_STRIP: 1                 # linuxdeploy's strip does not read recent libraries
        run: |
          mkdir -p AppDir/usr/bin
          cp build/hydra64 build/hydra64-convert build/hydra64-tablefs build/stockfish build/shuffle AppDir/usr/bin/
          cp -r build/databases AppDir/usr/bin/databases
          install -Dm644 LICENSE THIRD-PARTY.md -t AppDir/usr/share/licenses/hydra64
          cp -r licenses AppDir/usr/share/licenses/hydra64/licenses
          install -Dm644 packaging/linux/io.github.antidote1911.hydra64.metainfo.xml -t AppDir/usr/share/metainfo
          base=https://github.com/linuxdeploy
          curl -fsSL -o linuxdeploy "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o linuxdeploy-plugin-qt "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export PATH="$PWD:$PATH" QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Besides X11: "offscreen" (no display: --screenshot on a server, and the check below),
          # and Wayland when this Qt has the plugins
          wayland=$(cd "$QT_ROOT_DIR/plugins/platforms" && ls libqwayland*.so 2>/dev/null | paste -sd ';' || true)
          export EXTRA_PLATFORM_PLUGINS="libqoffscreen.so${wayland:+;$wayland}"
          export OUTPUT="Hydra64-${LABEL//\//-}-linux-x86_64.AppImage"
          linuxdeploy --appdir AppDir \
              --executable AppDir/usr/bin/hydra64 --executable AppDir/usr/bin/hydra64-convert \
              --executable AppDir/usr/bin/hydra64-tablefs \
              --desktop-file packaging/linux/hydra64.desktop --icon-file resources/hydra64.svg \
              --plugin qt --output appimage

      - name: Check that the AppImage starts
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QT_QPA_PLATFORM: offscreen
        run: env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH timeout 120 ./Hydra64-*-linux-x86_64.AppImage --version

      - name: Pack the archive and the Debian package
        # The folder linuxdeploy has just filled (AppDir: programs, Qt, AppRun), as it is.
        #   .tar.gz  a "Hydra64" folder to extract anywhere, started by Hydra64/hydra64
        #   .deb     the same folder in /opt/hydra64, commands in /usr/bin, menu entry
        run: |
          version=${LABEL#v}
          [[ $LABEL == v* ]] || version=$(sed -n 's/^project(Hydra64 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)

          cp -a AppDir Hydra64
          printf '%s\n' '#!/bin/sh' '# Starts Hydra64 from this folder, wherever it is.' \
              'exec "$(dirname "$(readlink -f "$0")")/AppRun" "$@"' > Hydra64/hydra64
          chmod 755 Hydra64/hydra64
          tar -czf "Hydra64-${LABEL//\//-}-linux-x86_64.tar.gz" --owner=0 --group=0 Hydra64

          root=deb/hydra64
          mkdir -p $root/DEBIAN $root/opt $root/usr/bin $root/usr/share/doc/hydra64
          cp -a AppDir $root/opt/hydra64
          printf '%s\n' '#!/bin/sh' 'exec /opt/hydra64/AppRun "$@"' > $root/usr/bin/hydra64
          printf '%s\n' '#!/bin/sh' 'exec /opt/hydra64/usr/bin/hydra64-convert "$@"' > $root/usr/bin/hydra64-convert
          chmod 755 $root/usr/bin/hydra64 $root/usr/bin/hydra64-convert
          install -Dm644 packaging/linux/hydra64.desktop -t $root/usr/share/applications
          install -Dm644 packaging/linux/io.github.antidote1911.hydra64.metainfo.xml -t $root/usr/share/metainfo
          install -Dm644 resources/hydra64.svg -t $root/usr/share/icons/hicolor/scalable/apps
          install -Dm644 LICENSE $root/usr/share/doc/hydra64/copyright
          chmod -R u=rwX,go=rX $root
          sed -e "s/{VERSION}/$version/" -e "s/{SIZE}/$(du -sk $root | cut -f1)/" packaging/debian/control > $root/DEBIAN/control
          dpkg-deb --root-owner-group -Zxz --build $root "hydra64_${version}_amd64.deb"
          dpkg-deb --info "hydra64_${version}_amd64.deb"

      - name: Check the archive and the Debian package
        # The package: installed for real, both commands run, then removed.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir check && tar -xzf Hydra64-*-linux-x86_64.tar.gz -C check
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH timeout 120 check/Hydra64/hydra64 --version
          sudo apt-get install -y ./hydra64_*_amd64.deb
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH timeout 120 hydra64 --version
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH hydra64-convert 2>&1 | head -2
          test -f /usr/share/applications/hydra64.desktop
          sudo apt-get remove -y hydra64
          test ! -e /opt/hydra64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Hydra64-*-linux-x86_64.AppImage
            Hydra64-*-linux-x86_64.tar.gz
            hydra64_*_amd64.deb
          if-no-files-found: error
          compression-level: 0

  flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10 # the runtime of the manifest
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Hydra64-${{ inputs.release || github.ref_name }}-linux-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.antidote1911.hydra64.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Check that the application starts
        # In the folder the action has just built (flatpak_app), with the rights of the manifest.
        # Not blocking: inside this container the sandbox itself does not always start (no
        # session bus, no FUSE), which says nothing about the bundle. Look at the result of the step.
        continue-on-error: true
        run: |
          dbus-run-session -- flatpak-builder --run flatpak_app \
              packaging/flatpak/io.github.antidote1911.hydra64.yml env QT_QPA_PLATFORM=offscreen hydra64 --version

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: Hydra64-*-linux-x86_64.flatpak
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/') || inputs.release != ''
    needs: [windows, linux, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7 # the notes of the release and the Stockfish version

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        # A tag: creates the release with all the files, their checksums and the notes
        # (.github/release-notes.md, then the list of changes GitHub writes).
        # "release" given by hand: adds to that release the files it does not have yet. A file
        # already published is left as it is — its checksum may be written in a package recipe.
        env:
          GH_TOKEN: ${{ github.token }}
          ADD_TO: ${{ inputs.release }}
        run: |
          tag=$LABEL
          stockfish=$(sed -n 's/^set(STOCKFISH_TAG "\([^"]*\)".*/\1/p' CMakeLists.txt)
          sed -e "s/{TAG}/$tag/g" -e "s/{VERSION}/${tag#v}/g" -e "s/{STOCKFISH}/$stockfish/g" .github/release-notes.md > notes.md
          cd dist
          if [[ -n $ADD_TO ]]; then
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > ../published
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output SHA256SUMS || : > SHA256SUMS
              new=()
              for f in Hydra64-* hydra64_*; do
                  if grep -qxF "$f" ../published; then echo "already published, left as it is: $f"; else new+=("$f"); fi
              done
              if (( ${#new[@]} )); then
                  sha256sum "${new[@]}" >> SHA256SUMS
                  gh release upload "$tag" "${new[@]}" --repo "$GITHUB_REPOSITORY"
                  gh release upload "$tag" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
                  printf '\n**Full Changelog**: https://github.com/%s/commits/%s\n' "$GITHUB_REPOSITORY" "$tag" >> ../notes.md
                  gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file ../notes.md
              fi
              cat SHA256SUMS
          else
              sha256sum Hydra64-* hydra64_* > SHA256SUMS && cat SHA256SUMS
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                  gh release upload "$tag" * --repo "$GITHUB_REPOSITORY" --clobber
              else
                  gh release create "$tag" * --repo "$GITHUB_REPOSITORY" \
                      --title "Hydra64 ${tag#v}" --notes-file ../notes.md --generate-notes
              fi
          fi
