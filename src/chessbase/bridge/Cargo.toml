[package]
name = "cbbridge"
version = "0.1.0"
edition = "2021"
description = "Hydra64 : lecture des bases ChessBase (.cbh, .2cbh, archives .cbv) via cbvault, exposée en C"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# Pinned versions: the format is read by cbvault (MIT, https://github.com/itshak/cbvault).
cbvault = "=0.1.7"
cbvault-format = "=0.1.7"

# cbvault: modified local copy (vendor/cbvault/HYDRA64.md), to read the moves without going
# through the PGN text.
# cbvault-chess: modified local copy (vendor/cbvault-chess/HYDRA64.md), to keep the irregular
# moves that ChessBase accepts.
[patch.crates-io]
cbvault = { path = "vendor/cbvault" }
cbvault-chess = { path = "vendor/cbvault-chess" }
# cbvault-format: modified local copy (vendor/cbvault-format/HYDRA64.md), to read the
# multiple-choice questions of .2cbh databases.
cbvault-format = { path = "vendor/cbvault-format" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# "unwind" (and not "abort"): an internal error of the library is caught at the
# C boundary and becomes an error message, instead of closing Hydra64.
panic = "unwind"
